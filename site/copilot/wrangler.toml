# 副驾驶插件的中转服务（agents C133、营销团队/副驾驶/技术方案.md）：独立的 Worker 和 D1，和官网 new-forecast-site 分开。
# - 密钥不写在这里：GEMINI_API_KEY、COPILOT_TOKEN 由 Amos 在控制台 Settings → Variables and Secrets 填（C21）；没填时 /v1/* 全部 404（默认关着，C102）。
# - D1 的 database_id 不写在这里：部署前由 scripts/ensure-d1.mjs 按名字查（没有就建）。
# - 没有定时任务（全账号只有 5 个，C120）。
name = "quickcome-copilot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "quickcome-copilot"
database_id = "local-only"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
GEMINI_MODEL = "gemini-flash-latest"
DAILY_REPLY_CAP = "10"

[env.staging]
name = "quickcome-copilot-staging"
workers_dev = true
keep_vars = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "quickcome-copilot-staging"
database_id = "local-only"
migrations_dir = "migrations"

[env.staging.vars]
ENVIRONMENT = "staging"
GEMINI_MODEL = "gemini-flash-latest"
DAILY_REPLY_CAP = "10"
